<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Platformer - Athena Prototypes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 100%);
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-container {
            text-align: center;
            max-width: 100%;
        }

        h1 {
            margin-bottom: 1rem;
            font-size: 2rem;
            background: linear-gradient(135deg, #6366f1, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .controls {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .controls p {
            margin: 0.5rem 0;
            color: #cbd5e1;
        }

        .controls strong {
            color: #22d3ee;
        }

        #game-canvas {
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-width: 100%;
            height: auto;
        }

        .back-link {
            margin-top: 1.5rem;
            display: inline-block;
            color: #22d3ee;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border: 2px solid #22d3ee;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: #22d3ee;
            color: #0f172a;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }

            .controls {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎮 Simple Platformer</h1>
        
        <div class="controls">
            <p><strong>Arrow Keys</strong> or <strong>A/D</strong> - Move left/right</p>
            <p><strong>Spacebar</strong> or <strong>W</strong> - Jump</p>
            <p><strong>Goal:</strong> Navigate the platforms and reach the top!</p>
        </div>

        <div id="game-canvas"></div>

        <a href="../../index.html" class="back-link">← Back to Home</a>
    </div>

    <!-- Phaser 3 from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
